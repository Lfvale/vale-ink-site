<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>a story for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=VT323&family=Orbitron:wght@700&family=Share+Tech+Mono&family=Zen+Kaku+Gothic+New:wght@300;500&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

<style>
  /* ============================================================
     EDIT ZONE 1: MAIN STORY COLORS ("cozy blue")
     Palette for the teaser screens and the story console at the
     very end. Per-node overrides live in EDIT ZONE 7. Every other
     prologue screen has its own separate look below.
     ============================================================ */
  :root {
    --bg:        #1B1F2E;
    --text:      #EDE4D3;
    --accent:    #D9A566;
    --choice:    #C97C7C;
    --dim:       #7A8296;
    --border:    #3A3F52;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    overflow: hidden;
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'IM Fell English', Georgia, serif;
    color: var(--text);
    transition: background-color 1.2s ease, color 1.2s ease;
  }

  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }

  .stage-screen {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1.1s ease;
  }
  .stage-screen.active { opacity: 1; pointer-events: auto; }
  .stage-screen.fade-out { opacity: 0; pointer-events: none; }

  /* ============================================================
     SCREEN 1 — TEASER (cozy blue)
     EDIT ZONE 0A: change TEASER_LINES in the script below.
     ============================================================ */
  #teaserScreen { background: var(--bg); }

  #teaserText {
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(2.2rem, 6.5vw, 3.8rem);
    color: var(--text);
    letter-spacing: 0.03em;
    text-align: center;
    padding: 0 8vw;
    opacity: 1;
    transition: opacity 1.3s ease;
  }
  #teaserText.fade { opacity: 0; }

  #teaserPrompt {
    margin-top: 2.4em;
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    color: var(--dim);
    opacity: 0.5;
    animation: blink 1.8s steps(1) infinite;
  }

  /* ============================================================
     SCREEN 2 (reused 5x) — BLACK CARD
     EDIT ZONE 0B: change BLACK_STEPS in the script below.
     ============================================================ */
  #blackScreen { background: #000; color: #fff; }
  #blackScreen::before {
    content: "";
    position: absolute;
    inset: 22px;
    border: 1px solid rgba(255,255,255,0.55);
    pointer-events: none;
  }
  #blackScreen::after {
    content: "";
    position: absolute;
    inset: 30px;
    border: 1px solid rgba(255,255,255,0.22);
    pointer-events: none;
  }
  #blackMain {
    position: relative;
    z-index: 1;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: clamp(1.5rem, 4vw, 2.3rem);
    text-align: center;
    letter-spacing: 0.04em;
    padding: 0 8vw;
  }
  #blackByline {
    position: relative;
    z-index: 1;
    display: none;
    font-family: 'IM Fell English', serif;
    font-style: italic;
    font-size: 0.95rem;
    color: rgba(255,255,255,0.6);
    letter-spacing: 0.2em;
    margin-top: 0.7em;
  }
  #blackPrompt {
    position: relative;
    z-index: 1;
    margin-top: 2.2em;
    font-family: 'Courier New', monospace;
    font-size: 0.68rem;
    letter-spacing: 0.3em;
    color: rgba(255,255,255,0.5);
    animation: blink 1.8s steps(1) infinite;
  }

  /* ============================================================
     SCREEN 3 — FALLOUT / ROBCO TERMINAL
     EDIT ZONE 0C: change BOOT_TEXT in the script below.
     ============================================================ */
  #bootScreen {
    position: fixed;
    inset: 0;
    display: none;
    background: #030A03;
    color: #4AFF6E;
    font-family: 'VT323', monospace;
    font-size: clamp(1rem, 2.3vw, 1.35rem);
    line-height: 1.6;
    letter-spacing: 0.02em;
    padding: 8vh 10vw;
    cursor: pointer;
    text-shadow: 0 0 4px rgba(74,255,110,0.75), 0 0 14px rgba(74,255,110,0.35);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
  }
  #bootScreen.active { opacity: 1; pointer-events: auto; }
  #bootScreen.fade-out { opacity: 0; pointer-events: none; }
  #bootScreen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  #bootScreen::after {
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,0.55) 100%);
    pointer-events: none;
  }
  @keyframes crtFlicker {
    0%, 96%, 100% { opacity: 1; }
    97% { opacity: 0.85; }
    98% { opacity: 1; }
    99% { opacity: 0.92; }
  }
  #bootLines { position: relative; z-index: 1; animation: crtFlicker 6s infinite; white-space: pre-wrap; }
  .typed-line { min-height: 1.6em; }
  #bootPrompt {
    display: none;
    position: relative;
    z-index: 1;
    margin-top: 2em;
    letter-spacing: 0.15em;
    animation: blink 1.3s steps(1) infinite;
  }
  #bootPrompt.show { display: block; }
  #bootPrompt::after { content: '_'; }

  /* ============================================================
     SCREEN 4 — STARCRAFT / STEEL-BLUE COMMAND HUD
     EDIT ZONE 0D: change STARCRAFT_TEXT in the script below.
     ============================================================ */
  #starcraftScreen {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    background: linear-gradient(160deg, #0a1420 0%, #142333 45%, #0a1420 100%);
    color: #8FE3FF;
    font-family: 'Share Tech Mono', monospace;
    padding: 8vh 10vw;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.9s ease;
    overflow: hidden;
  }
  #starcraftScreen.active { opacity: 1; pointer-events: auto; }
  #starcraftScreen.fade-out { opacity: 0; pointer-events: none; }
  #starcraftScreen::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(180deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    mix-blend-mode: multiply;
  }
  .hud-corner { position: absolute; width: 34px; height: 34px; border-color: #5FD3FF; opacity: 0.85; }
  .hud-corner.tl { top: 22px; left: 22px; border-top: 2px solid; border-left: 2px solid; }
  .hud-corner.tr { top: 22px; right: 22px; border-top: 2px solid; border-right: 2px solid; }
  .hud-corner.bl { bottom: 22px; left: 22px; border-bottom: 2px solid; border-left: 2px solid; }
  .hud-corner.br { bottom: 22px; right: 22px; border-bottom: 2px solid; border-right: 2px solid; }
  #starcraftHeader {
    position: relative; z-index: 1;
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(1rem, 2.2vw, 1.3rem);
    letter-spacing: 0.25em;
    color: #EAF6FF;
    text-shadow: 0 0 8px rgba(95,211,255,0.7);
    margin-bottom: 1em;
  }
  #starcraftLines {
    position: relative; z-index: 1;
    font-size: clamp(0.85rem, 1.8vw, 1.05rem);
    line-height: 1.8;
    text-shadow: 0 0 6px rgba(95,211,255,0.5);
    white-space: pre-wrap;
  }
  #starcraftPrompt {
    display: none;
    position: relative; z-index: 1;
    margin-top: 2em;
    font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.2em;
    color: #5FD3FF;
    animation: blink 1.3s steps(1) infinite;
  }
  #starcraftPrompt.show { display: block; }
  #starcraftPrompt::before { content: '[ '; }
  #starcraftPrompt::after { content: ' ]'; }

  /* ============================================================
     SCREEN 5 — STRAY / B-12 TERMINAL BOOT
     EDIT ZONE 0E: change STRAY_LINES in the script below.
     Mixes monospace "system" lines with softer narrative lines,
     styled differently, inside the same typed sequence.
     ============================================================ */
  #strayScreen {
    overflow: hidden;
    background: linear-gradient(180deg, #0c0714 0%, #050308 100%);
    padding: 8vh 8vw;
  }
  #strayScreen::before {
    content: "";
    position: absolute;
    inset: 26px;
    border: 1px solid rgba(120,90,160,0.45);
    pointer-events: none;
  }
  #strayScreen::after {
    content: "";
    position: absolute;
    inset: 34px;
    border: 1px solid rgba(120,90,160,0.22);
    pointer-events: none;
  }
  #strayGlow {
    position: absolute;
    width: 70vw; height: 70vw;
    left: 50%; top: 45%;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(150,100,200,0.15), transparent 60%);
    filter: blur(60px);
    pointer-events: none;
  }
  #starField { position: absolute; inset: 0; pointer-events: none; }
  .star {
    position: absolute;
    background: #fff;
    border-radius: 50%;
    animation: twinkle 3s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50%      { opacity: 1; }
  }
  #strayContent { position: relative; z-index: 2; max-width: 480px; margin: 0 auto; text-align: left; }
  #strayLinesEl { min-height: 1em; }
  #strayLinesEl .typed-line.header-line {
    font-family: 'Orbitron', sans-serif;
    font-weight: 700;
    font-size: clamp(0.85rem, 2vw, 1.05rem);
    letter-spacing: 0.2em;
    color: #D8CDEB;
    text-shadow: 0 0 8px rgba(150,100,200,0.6);
    margin-bottom: 0.4em;
  }
  #strayLinesEl .typed-line.sys-line {
    font-family: 'Share Tech Mono', monospace;
    font-size: clamp(0.8rem, 1.7vw, 0.95rem);
    letter-spacing: 0.06em;
    color: #9F7FD9;
    text-shadow: 0 0 6px rgba(150,100,220,0.5);
    white-space: pre-wrap;
  }
  #strayLinesEl .typed-line.narrative-line {
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: clamp(0.95rem, 2.1vw, 1.15rem);
    letter-spacing: 0.1em;
    line-height: 1.9;
    color: #E7DEF5;
    text-align: center;
    text-shadow: 0 0 8px rgba(150,100,200,0.3);
    white-space: pre-wrap;
    margin: 0.2em 0;
  }
  #strayPrompt {
    position: relative;
    z-index: 2;
    display: none;
    margin-top: 1.8em;
    text-align: center;
    font-family: 'Zen Kaku Gothic New', sans-serif;
    font-weight: 300;
    font-size: 0.66rem;
    letter-spacing: 0.35em;
    color: #B678FF;
    text-shadow: 0 0 8px rgba(182,120,255,0.6);
    animation: blink 1.6s steps(1) infinite;
  }
  #strayPrompt.show { display: block; }

  /* ============================================================
     SCREEN 6 — DIGITAL CIRCUS
     EDIT ZONE 0F: change CIRCUS_LINES in the script below.
     ============================================================ */
  #circusScreen {
    overflow: hidden;
    background: repeating-linear-gradient(135deg, #3E2277 0px, #3E2277 46px, #4E2C99 46px, #4E2C99 92px);
    padding: 6vh 8vw;
  }
  #circusScreen::before {
    content: "";
    position: absolute;
    left: 50%; top: 42%;
    width: 70vw; height: 70vw;
    transform: translate(-50%, -50%);
    background: radial-gradient(circle, rgba(255,255,255,0.18), transparent 60%);
    pointer-events: none;
  }
  #circusScreen::after {
    content: "";
    position: absolute;
    inset: 24px;
    border: 6px solid #B026FF;
    border-radius: 28px;
    box-shadow: inset 0 0 0 3px rgba(255,255,255,0.25);
    pointer-events: none;
  }
  #circusContent { position: relative; z-index: 2; text-align: center; max-width: 560px; }
  @keyframes wiggle {
    0%, 100% { transform: rotate(-1deg); }
    50%      { transform: rotate(1deg); }
  }
  #circusLinesEl {
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: clamp(1rem, 2.6vw, 1.4rem);
    color: #FFFFFF;
    letter-spacing: 0.02em;
    line-height: 1.65;
    text-shadow: 0 0 14px rgba(255,61,173,0.55), 0 3px 0 rgba(0,0,0,0.25);
    white-space: pre-wrap;
    animation: wiggle 3.2s ease-in-out infinite;
    display: inline-block;
  }
  #circusNameRow {
    display: none;
    margin-top: 1.6em;
    flex-direction: column;
    align-items: center;
    gap: 0.7em;
  }
  #circusNameHint {
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 0.78rem;
    letter-spacing: 0.15em;
    color: #FF3DAD;
    animation: blink 1.5s steps(1) infinite;
  }
  #circusNameForm { display: flex; gap: 10px; }
  #circusNameInput {
    background: rgba(255,255,255,0.1);
    border: 2px solid #FF3DAD;
    border-radius: 12px;
    padding: 8px 16px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1rem;
    color: #fff;
    outline: none;
    text-align: center;
    min-width: 180px;
  }
  #circusNameInput::placeholder { color: rgba(255,255,255,0.55); }
  #circusNameBtn {
    background: #FF3DAD;
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 8px 18px;
    font-family: 'Fredoka', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  #circusNameBtn:hover { background: #ff64bd; }
  #circusPrompt {
    display: none;
    margin-top: 1.8em;
    font-family: 'Fredoka', sans-serif;
    font-weight: 500;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: #FF3DAD;
    animation: blink 1.5s steps(1) infinite;
  }
  #circusPrompt.show { display: block; }

  /* ── Soft starfield behind the story console ─────────────── */
  #storyStars {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #storyStars .star {
    position: absolute;
    background: var(--text);
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }

  /* ── Frame (behind everything, shows once the console appears) ── */
  #frame {
    position: fixed;
    inset: 18px;
    border: 1px solid var(--border);
    pointer-events: none;
    z-index: 1;
    transition: border-color 1.2s ease;
  }
  #frame::before {
    content: "";
    position: absolute;
    inset: 6px;
    border: 1px solid var(--border);
    transition: border-color 1.2s ease;
  }

  /* ── Console ──────────────────────────────────────────────── */
  #console {
    width: min(680px, 88vw);
    height: min(78vh, 720px);
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    padding: 40px 8px;
    opacity: 0;
    transition: opacity 1s ease;
  }
  #console.visible { opacity: 1; }

  #scrollArea {
    overflow-y: auto;
    flex: 1;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  #scrollArea::-webkit-scrollbar { width: 6px; }
  #scrollArea::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .passage {
    font-size: 1.15rem;
    line-height: 1.8;
    margin-bottom: 1.2em;
    white-space: pre-wrap;
  }

  .passage-small {
    font-size: 0.78rem;
    font-style: italic;
    opacity: 0.7;
    margin-bottom: 0.9em;
    white-space: pre-wrap;
  }

  .passage.typing::after {
    content: '▍';
    color: var(--accent);
    animation: blink 1s steps(1) infinite;
    display: inline-block;
  }

  .divider {
    text-align: center;
    color: var(--border);
    font-size: 1rem;
    letter-spacing: 0.6em;
    margin: 0.2em 0 1.6em;
    user-select: none;
    transition: color 1.2s ease;
  }

  .continue-prompt {
    color: var(--dim);
    font-size: 1.1rem;
    letter-spacing: 0.5em;
    margin: 0.4em 0 1em;
    cursor: pointer;
    animation: blink 1.6s steps(1) infinite;
    transition: opacity 0.35s ease, color 1.2s ease;
    user-select: none;
  }
  .continue-prompt.fade-out { opacity: 0; }

  #choices {
    margin-top: 2.6em;
    padding-top: 1.4em;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 0.9em;
    transition: border-color 1.2s ease;
  }

  .choice {
    position: relative;
    font-family: 'Courier New', monospace;
    font-size: 0.92rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--choice);
    background: rgba(255,255,255,0.015);
    border: 1px solid var(--border);
    border-radius: 2px;
    text-align: left;
    padding: 14px 20px 14px 34px;
    cursor: pointer;
    opacity: 0;
    transition: background 0.2s ease, opacity 0.4s ease, color 1.2s ease,
                border-color 0.25s ease, transform 0.25s ease;
  }
  .choice::before {
    content: '›';
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--accent);
    opacity: 0.6;
    transition: color 1.2s ease, opacity 0.25s ease;
  }
  .choice.show { opacity: 1; }
  .choice:hover, .choice:focus-visible {
    background: rgba(217, 165, 102, 0.08);
    outline: none;
    border-color: var(--accent);
    color: var(--accent);
    transform: translateX(8px);
  }
  .choice:hover::before, .choice:focus-visible::before { opacity: 1; }

  #inputRow {
    margin-top: 1.2em;
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: 'Courier New', monospace;
    color: var(--dim);
    font-size: 0.92rem;
    transition: color 1.2s ease;
  }
  #typedInput {
    flex: 1;
    background: none;
    border: none;
    border-bottom: 1px solid var(--border);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 0.92rem;
    padding: 4px 2px;
    outline: none;
    transition: color 1.2s ease, border-color 1.2s ease;
  }
  #typedInput:focus { border-bottom-color: var(--accent); }

  #hint {
    font-family: 'Courier New', monospace;
    font-size: 0.72rem;
    color: var(--dim);
    margin-top: 1em;
    opacity: 0.5;
    transition: color 1.2s ease;
  }

  #restartRow { margin-top: 1.6em; }
  .restart-btn {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--dim);
    background: none;
    border: 1px solid var(--border);
    padding: 6px 14px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .restart-btn:hover { color: var(--accent); border-color: var(--accent); }
</style>
</head>
<body>

<!-- SCREEN 1: teaser (cozy blue) -->
<div id="teaserScreen" class="stage-screen proceed-screen">
  <div id="teaserText"></div>
  <div id="teaserPrompt">tap to continue</div>
</div>

<!-- SCREEN 2 (reused): black card -->
<div id="blackScreen" class="stage-screen proceed-screen">
  <div id="blackMain"></div>
  <div id="blackByline"></div>
  <div id="blackPrompt"></div>
</div>

<!-- SCREEN 3: Fallout / RobCo terminal -->
<div id="bootScreen" class="proceed-screen">
  <div id="bootLines"></div>
  <div id="bootPrompt">&gt;CLICK ANYWHERE TO PLAY</div>
</div>

<!-- SCREEN 4: StarCraft / steel-blue HUD -->
<div id="starcraftScreen" class="proceed-screen">
  <div class="hud-corner tl"></div>
  <div class="hud-corner tr"></div>
  <div class="hud-corner bl"></div>
  <div class="hud-corner br"></div>
  <div id="starcraftHeader">TERRAN DOMINION // COMMAND NET</div>
  <div id="starcraftLines"></div>
  <div id="starcraftPrompt">CLICK TO CONTINUE</div>
</div>

<!-- SCREEN 5: Stray / B-12 terminal -->
<div id="strayScreen" class="stage-screen proceed-screen">
  <div id="strayGlow"></div>
  <div id="starField"></div>
  <div id="strayContent">
    <div id="strayLinesEl"></div>
  </div>
  <div id="strayPrompt"></div>
</div>

<!-- SCREEN 6: Digital Circus -->
<div id="circusScreen" class="stage-screen proceed-screen">
  <div id="circusContent">
    <div id="circusLinesEl"></div>
    <div id="circusNameRow">
      <div id="circusNameHint">&gt; CLICK TO NAME YOURSELF</div>
      <div id="circusNameForm">
        <input id="circusNameInput" type="text" autocomplete="off" spellcheck="false" placeholder="type your name...">
        <button id="circusNameBtn" type="button">OKAY!</button>
      </div>
    </div>
    <div id="circusPrompt"></div>
  </div>
</div>

<div id="storyStars"></div>
<div id="frame"></div>

<div id="console">
  <div id="scrollArea">
    <div id="log"></div>
    <div id="choices"></div>
    <div id="inputRow" style="display:none;">
      <span>&gt;</span>
      <input id="typedInput" type="text" autocomplete="off" spellcheck="false" placeholder="type a number or keyword, then enter">
    </div>
    <div id="hint">click a choice above, or type its number and press enter</div>

  let zCounter     = 100;
  let playerClass  = null; // 'assassin' | 'mage' | 'warrior' — set when she picks dagger/crystal/bracelet

  function lockFor(ms) { locked = true; setTimeout(() => { locked = false; }, ms); }
  function front(el) { zCounter += 1; el.style.zIndex = zCounter; }

  function transitionTo(fromEl, toEl, ms, displayVal, cb) {
    fromEl.classList.remove('active');
    fromEl.classList.add('fade-out');
    setTimeout(() => {
      fromEl.style.display = 'none';
      fromEl.classList.remove('fade-out');
      toEl.style.display = displayVal;
      front(toEl);
      requestAnimationFrame(() => toEl.classList.add('active'));
      if (cb) cb();
    }, ms);
  }

  // ── Theming (main story palette) ────────────────────────────
  const rootStyle = document.documentElement.style;
  const computed  = getComputedStyle(document.documentElement);
  const DEFAULT_THEME = {
    bg:     computed.getPropertyValue('--bg').trim(),
    text:   computed.getPropertyValue('--text').trim(),
    accent: computed.getPropertyValue('--accent').trim(),
    choice: computed.getPropertyValue('--choice').trim(),
    dim:    computed.getPropertyValue('--dim').trim(),
    border: computed.getPropertyValue('--border').trim()
  };
  function applyTheme(theme) {
    const t = Object.assign({}, DEFAULT_THEME, theme || {});
    rootStyle.setProperty('--bg', t.bg);
    rootStyle.setProperty('--text', t.text);
    rootStyle.setProperty('--accent', t.accent);
    rootStyle.setProperty('--choice', t.choice);
    rootStyle.setProperty('--dim', t.dim);
    rootStyle.setProperty('--border', t.border);
  }

  // ── Generic typewriter for terminal-style screens ───────────
  // lines can be plain strings, or (for Stray) objects like
  // { type: 'sys'|'header'|'narrative'|'blank', text }.
  // onComplete runs once every line has finished typing.
  function typeLines(containerEl, lines, onComplete) {
    let i = 0;
    function step() {
      if (i >= lines.length) {
        if (onComplete) onComplete();
        return;
      }
      const item   = lines[i];
      const isObj  = typeof item === 'object' && item !== null;
      const type   = isObj ? item.type : null;
      const text   = isObj ? item.text : item;

      if (type === 'blank' || text === '') {
        const blankEl = document.createElement('div');
        blankEl.className = 'typed-line';
        blankEl.innerHTML = '&nbsp;';
        containerEl.appendChild(blankEl);
        i++;
        setTimeout(step, 140);
        return;
      }

      const lineEl = document.createElement('div');
      lineEl.className = 'typed-line' + (type ? (' ' + type + '-line') : '');
      containerEl.appendChild(lineEl);

      let c = 0;
      (function charStep() {
        if (c < text.length) {
          lineEl.textContent += text[c];
          c++;
          setTimeout(charStep, 10 + Math.random() * 16);
        } else {
          i++;
          setTimeout(step, 160 + Math.random() * 140);
        }
      })();
    }
    step();
  }

  // ── Soft starfield behind the story console ─────────────────
  (function buildStoryStars() {
    const count = 70;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 4) + 's';
      s.style.animationDuration = (3 + Math.random() * 3) + 's';
      storyStars.appendChild(s);
    }
  })();

  // ── SCREEN 1: teaser ─────────────────────────────────────────
  teaserText.textContent = TEASER_LINES[0];
  front(teaserScreen);
  teaserScreen.style.display = 'flex';
  requestAnimationFrame(() => teaserScreen.classList.add('active'));

  function advanceTeaser() {
    if (locked) return;
    if (teaserIndex < TEASER_LINES.length - 1) {
      lockFor(2600);
      teaserText.classList.add('fade');
      setTimeout(() => {
        teaserIndex++;
        teaserText.textContent = TEASER_LINES[teaserIndex];
        requestAnimationFrame(() => teaserText.classList.remove('fade'));
      }, 1100);
    } else {
      lockFor(1200);
      enterBlack(0, teaserScreen);
    }
  }
  teaserScreen.addEventListener('click', advanceTeaser);

  // ── SCREEN 2 (reused): black card ───────────────────────────
  function enterBlack(index, fromEl) {
    const step = BLACK_STEPS[index];
    blackMain.textContent = step.text;
    if (step.byline) {
      blackByline.textContent = step.byline;
      blackByline.style.display = 'block';
    } else {
      blackByline.style.display = 'none';
    }
    blackPrompt.textContent = step.prompt || 'tap to continue';
    blackScreen.dataset.next = step.next;
    transitionTo(fromEl, blackScreen, 1100, 'flex');
  }

  function handleBlackClick() {
    if (locked) return;
    const next = blackScreen.dataset.next;
    if (next === 'boot') {
      lockFor(1000);
      transitionTo(blackScreen, bootScreen, 900, 'block', () => typeLines(bootLinesEl, BOOT_TEXT, () => {
        setTimeout(() => bootPrompt.classList.add('show'), 450);
      }));
    } else if (next === 'starcraft') {
      lockFor(1000);
      transitionTo(blackScreen, starcraftScreen, 900, 'flex', () => typeLines(starcraftLines, STARCRAFT_TEXT, () => {
        setTimeout(() => starcraftPrompt.classList.add('show'), 450);
      }));
    } else if (next === 'stray') {
      lockFor(1300);
      transitionTo(blackScreen, strayScreen, 1200, 'flex', () => {
        if (!starsBuilt) { buildStars(); starsBuilt = true; }
        typeLines(strayLinesEl, STRAY_LINES, () => {
          strayPrompt.textContent = STRAY_PROMPT_TEXT;
          setTimeout(() => strayPrompt.classList.add('show'), 450);
        });
      });
    } else if (next === 'circus') {
      lockFor(1100);
      transitionTo(blackScreen, circusScreen, 1000, 'flex', () => {
        typeLines(circusLinesEl, CIRCUS_LINES, () => {
          circusNameRow.style.display = 'flex';
          circusNameInput.value = '';
          circusNameInput.focus();
        });
      });
    } else if (next === 'story') {
      lockFor(1300);
      blackScreen.classList.remove('active');
      blackScreen.classList.add('fade-out');
      setTimeout(() => {
        blackScreen.style.display = 'none';
        consoleEl.classList.add('visible');
        renderNode(START_NODE);
      }, 1200);
    }
  }
  blackScreen.addEventListener('click', handleBlackClick);

  // ── SCREEN 3: Fallout / RobCo boot ──────────────────────────
  bootScreen.addEventListener('click', () => {
    if (locked) return;
    lockFor(1000);
    enterBlack(1, bootScreen);
  });

  // ── SCREEN 4: StarCraft HUD ──────────────────────────────────
  starcraftScreen.addEventListener('click', () => {
    if (locked) return;
    lockFor(1000);
    enterBlack(2, starcraftScreen);
  });

  // ── SCREEN 5: Stray / B-12 terminal ─────────────────────────
  function buildStars() {
    const count = 90;
    for (let i = 0; i < count; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = 1 + Math.random() * 2;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.left = Math.random() * 100 + '%';
      s.style.top = Math.random() * 100 + '%';
      s.style.animationDelay = (Math.random() * 3) + 's';
      s.style.animationDuration = (2 + Math.random() * 3) + 's';
      starField.appendChild(s);
    }
  }
  strayScreen.addEventListener('click', () => {
    if (locked) return;
    lockFor(1300);
    enterBlack(3, strayScreen);
  });

  // ── SCREEN 6: Digital Circus ─────────────────────────────────
  function submitCircusName() {
    circusNameRow.style.display = 'none';

    const lineEl = document.createElement('div');
    lineEl.className = 'typed-line';
    circusLinesEl.appendChild(lineEl);
    // No matter what she types, she doesn't get to pick her own name
    // in here — Caine already has other plans.
    const text = 'PERFECT. NICE TO MEET YOU, THING ONE!';
    let c = 0;
    (function charStep() {
      if (c < text.length) {
        lineEl.textContent += text[c];
        c++;
        setTimeout(charStep, 10 + Math.random() * 16);
      } else {
        circusReady = true;
        circusPrompt.textContent = 'CLICK TO CONTINUE';
        setTimeout(() => circusPrompt.classList.add('show'), 450);
      }
    })();
  }
  circusNameBtn.addEventListener('click', (e) => { e.stopPropagation(); submitCircusName(); });
  circusNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') submitCircusName(); });
  circusNameInput.addEventListener('click', (e) => e.stopPropagation());

  circusScreen.addEventListener('click', () => {
    if (locked || !circusReady) return;
    lockFor(1100);
    enterBlack(4, circusScreen);
  });

  // ── Keyboard alternative for every screen ───────────────────
  document.addEventListener('keydown', () => {
    if (document.activeElement === circusNameInput) return;
    const activeScreen = document.querySelector('.proceed-screen.active');
    if (activeScreen) activeScreen.click();
  });

  // ── Helpers ─────────────────────────────────────────────────
  function scrollDown() { scrollArea.scrollTop = scrollArea.scrollHeight; }

  function typeText(el, text, onDone) {
    typing = true;
    let i = 0;
    let displayed = '';
    el.classList.add('typing');

    function step() {
      if (i < text.length) {
        displayed += text[i];
        el.textContent = displayed;
        i++;
        scrollDown();

        const ch   = text[i - 1];
        const next = text[i] || '';

        let delay = 50 + Math.random() * 50;

        if (ch === '.')              delay += 280 + Math.random() * 120;
        if (ch === ',')              delay += 110 + Math.random() * 70;
        if (ch === '?' || ch === '!') delay += 260 + Math.random() * 100;
        if (ch === ';' || ch === ':') delay +=  90 + Math.random() * 50;
        if (ch === '\n')             delay += 320 + Math.random() * 160;

        if (ch === ' ' && next !== ' ') delay -= 20;

        if (Math.random() < 0.04) delay += 200 + Math.random() * 225;

        setTimeout(step, delay);
      } else {
        el.classList.remove('typing');
        typing = false;
        if (onDone) onDone();
      }
    }
    step();
  }

  function showContinuePrompt(onContinue) {
    const prompt = document.createElement('div');
    prompt.className = 'continue-prompt';
    prompt.textContent = '· · ·';
    log.appendChild(prompt);
    scrollDown();

    setTimeout(() => {
      prompt.classList.add('fade-out');
      setTimeout(() => { prompt.remove(); onContinue(); }, 380);
    }, 900);
  }

  function addDivider() {
    const div = document.createElement('div');
    div.className = 'divider';
    div.textContent = '· · ·';
    log.appendChild(div);
  }

  function renderNode(nodeId) {
    const node = STORY[nodeId];
    if (node.onEnter) node.onEnter();
    applyTheme(node.theme);
    choicesEl.innerHTML = '';
    inputRow.style.display = 'none';

    if (passageCount > 0) addDivider();
    passageCount++;

    // node.text and node.choices can be plain values, or functions that
    // depend on state (like playerClass) — resolve them once per render.
    const resolvedText    = typeof node.text === 'function' ? node.text() : node.text;
    const resolvedChoices = typeof node.choices === 'function' ? node.choices() : node.choices;

    function doMainText() {
      const p = document.createElement('div');
      p.className = 'passage';
      log.appendChild(p);

      typeText(p, resolvedText, () => {
      const hasChoices = resolvedChoices && resolvedChoices.length > 0;

      showContinuePrompt(() => {
        if (hasChoices) {
          resolvedChoices.forEach((choice, idx) => {
            const btn = document.createElement('button');
            btn.className = 'choice';
            btn.textContent = '🐾  ' + choice.label;
            btn.addEventListener('click', () => selectChoice(choice, node));
            choicesEl.appendChild(btn);
            setTimeout(() => btn.classList.add('show'), idx * 140);
          });

          inputRow.style.display = 'flex';
          typedInput.value = '';
          typedInput.focus();

          typedInput.onkeydown = (e) => {
            if (e.key === 'Enter') {
              const val = typedInput.value.trim().toLowerCase();
              let matched = null;
              const asNum = parseInt(val, 10);
              if (!isNaN(asNum) && resolvedChoices[asNum - 1]) {
                matched = resolvedChoices[asNum - 1];
              } else {
                matched = resolvedChoices.find(c => c.label.toLowerCase().includes(val));
              }
              if (matched) selectChoice(matched, node);
            }
          };
        } else {
          showRestart();
        }
        scrollDown();
      });
    });
    } // end doMainText

    if (node.intro) {
      const introP = document.createElement('div');
      introP.className = 'passage-small';
      log.appendChild(introP);
      typeText(introP, node.intro.text, () => {
        setTimeout(doMainText, 500);
      });
    } else {
      doMainText();
    }
  }

  function showRestart() {
    const row = document.createElement('div');
    row.id = 'restartRow';
    const btn = document.createElement('button');
    btn.className = 'restart-btn';
    btn.textContent = 'read again';
    btn.addEventListener('click', () => {
      log.innerHTML = '';
      choicesEl.innerHTML = '';
      passageCount = 0;
      playerClass = null;
      applyTheme(null);
      renderNode(START_NODE);
    });
    row.appendChild(btn);
    log.appendChild(row);
    scrollDown();
  }

  function selectChoice(choice) {
    if (typing) return;
    choicesEl.innerHTML = '';
    inputRow.style.display = 'none';
    renderNode(choice.goto);
  }

</script>

</body>
</html>
